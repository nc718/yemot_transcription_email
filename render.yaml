services:
  - type: web
    name: yemot-transcription-elastic
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app_elastic.py
    envVars:
      - key: YMOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ELASTIC_API_KEY
        sync: false
      - key: ELASTIC_FROM_EMAIL
        sync: false

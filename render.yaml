services:
  - type: web
    name: yemot-transcription-maileroo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app_maileroo.py
    envVars:
      - key: YMOT_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAILEROO_API_KEY
        sync: false
      - key: MAILEROO_FROM_EMAIL
        sync: false
